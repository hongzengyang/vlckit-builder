name: Build VLCKit (iOS arm64 Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15  # macOS 15 (Sequoia)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Install Python 3.7 (official installer, NOT homebrew)
        run: |
          curl -O https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg python-3.7.9-macosx10.9.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.7/bin" >> $GITHUB_PATH

      - name: Verify Python 3.7
        run: python3.7 --version

      - name: Clone VLCKit
        run: |
          git clone https://code.videolan.org/videolan/VLCKit.git
          cd VLCKit
          git submodule update --init --recursive

      - name: Build VLCKit (iOS arm64 only)
        run: |
          cd VLCKit
          chmod +x compileAndBuildVLCKit.sh
          ./compileAndBuildVLCKit.sh -a aarch64

      - name: Find results
        run: find . -name "MobileVLCKit*" -maxdepth 4

      - name: Upload Framework
        uses: actions/upload-artifact@v4
        with:
          name: MobileVLCKit-arm64
          path: |
            VLCKit/build/**/MobileVLCKit.framework
            VLCKit/build/**/MobileVLCKit.xcframework
