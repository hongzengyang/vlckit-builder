name: Build VLCKit 4.0.0a11 (iOS arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Python 3.7
        run: |
          curl -O https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg python-3.7.9-macosx10.9.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.7/bin" >> $GITHUB_PATH

      - name: Clone VLCKit + checkout tag 4.0.0a11
        run: |
          git clone https://code.videolan.org/videolan/VLCKit.git
          cd VLCKit
          git fetch --all --tags
          git checkout 4.0.0a11
          git submodule update --init --recursive

      - name: Build VLCKit (iOS arm64)
        run: |
          cd VLCKit
          chmod +x compileAndBuildVLCKit.sh
          ./compileAndBuildVLCKit.sh -a aarch64

      - name: Show outputs
        run: |
          echo "Searching for VLCKit.framework ..."
          find VLCKit -name "VLCKit.framework" -print
          find VLCKit -name "*.xcframework" -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VLCKit-iOS-arm64
          path: |
            VLCKit/**/VLCKit.framework
            VLCKit/**/VLCKit.xcframework
