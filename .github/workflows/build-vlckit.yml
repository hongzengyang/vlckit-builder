name: Build VLCKit (iOS arm64)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VLCKit on macOS 13 with Xcode 14.3
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 14.3
        run: sudo xcode-select -s /Applications/Xcode_14.3.app

      - name: Install Python 3.7 (official installer)
        run: |
          curl -O https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg python-3.7.9-macosx10.9.pkg -target /
          python3.7 --version || true

      - name: Add Python 3.7 to PATH
        run: |
          echo "/Library/Frameworks/Python.framework/Versions/3.7/bin" >> $GITHUB_PATH

      - name: Verify Python 3.7
        run: python3.7 --version

      - name: Clone VLCKit
        run: |
          git clone https://code.videolan.org/videolan/VLCKit.git
          cd VLCKit
          git submodule update --init --recursive

      - name: Build VLCKit (iOS arm64)
        run: |
          cd VLCKit
          chmod +x compileAndBuildVLCKit.sh
          ./compileAndBuildVLCKit.sh -a aarch64

      - name: List output
        run: find VLCKit -name "MobileVLCKit*"

      - name: Upload Framework
        uses: actions/upload-artifact@v4
        with:
          name: VLCKit-iOS
          path: |
            VLCKit/build/**/MobileVLCKit.framework
            VLCKit/build/**/MobileVLCKit.xcframework
